<!DOCTYPE html>
<html>

<head>
  <title>barasama-ar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;700&family=Shippori+Mincho:wght@500&display=swap"
    rel="stylesheet">
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    a-scene {
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
    }

    #debug-log {
      /* 今は一旦非表示。デバッグが必要になったら display: block; に戻せばOK */
      display: none;
      position: fixed;
      top: 0;
      bottom: auto;
      left: 0;
      right: 0;
      max-height: 30vh;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.8);
      color: #0f0;
      font-size: 12px;
      padding: 8px;
      z-index: 9999;
      white-space: pre-wrap;
      font-family: monospace;
    }

    #blow-btn {
      z-index: 10000;
    }

    /* ===== イントロ画面まわり ===== */
    #app-flow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      z-index: 20000;
      overflow: hidden;
    }

    .app-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('assets/home-bg.png');
      background-size: cover;
      background-position: center;
      display: none;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
    }

    .app-screen.active {
      display: flex;
    }

    /* ホーム画面 */
    #screen-home {
      justify-content: flex-end;
      padding-bottom: 110px;
    }

    #home-text {
      color: #fff;
      font-family: 'Shippori Mincho', serif;
      font-size: 16px;
      line-height: 1.9;
      text-align: left;
      padding: 0 32px;
      margin-bottom: 24px;
      min-height: 230px;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
    }

    /* 説明画面（共通） */
    .instruction-screen {
      justify-content: flex-start;
      padding-top: 60px;
    }

    .instruction-title {
      font-family: 'Kaisei Decol', serif;
      font-weight: 700;
      font-size: 30px;
      color: #402518;
      text-shadow: 0 6px 4px rgba(255, 255, 255, 0.9);
      margin-bottom: 24px;
    }

    .instruction-frame {
      width: 84%;
      max-width: 360px;
      border-radius: 4px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .instruction-caption {
      color: #fff;
      font-family: 'Shippori Mincho', serif;
      font-size: 18px;
      line-height: 1.7;
      text-align: center;
      margin-top: 28px;
      padding: 0 20px;
      min-height: 60px;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
    }

    /* チケット風ボタン（共通） */
    .ticket-btn {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%) scale(1);
      width: 76%;
      max-width: 294px;
      background-color: transparent;
      background-image: url('assets/ticket-button.png');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      -webkit-appearance: none;
      appearance: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
      border: none;
      cursor: pointer;
      padding: 18px 0;
      font-family: 'Kaisei Decol', serif;
      font-size: 22px;
      color: #1a1a1a;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease, transform 0.15s ease;
      animation: ticket-breathe 2.4s ease-in-out infinite;
    }

    .ticket-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .ticket-btn:active {
      transform: translateX(-50%) scale(0.95);
    }

    @keyframes ticket-breathe {

      0%,
      100% {
        transform: translateX(-50%) scale(1);
      }

      50% {
        transform: translateX(-50%) scale(1.03);
      }
    }

    .ticket-btn.visible:active {
      animation: none;
    }

    /* ボタンごとの文字調整 */
    #btn-home {
      font-size: 24px;
      padding: 8px 0px 8px 64px;
    }

    #btn-step1,
    #btn-step2 {
      font-size: 26px;
      padding: 10px 0px 12px 63px;
    }

    #btn-step3 {
      padding: 16px 0px 18px 69px;
    }

    #blow-btn {
      font-size: 26px;
      padding: 6px 0px 10px 69px;
    }
  </style>
</head>

<body style="margin:0;">

  <!-- ===== ①〜④ イントロ／説明フロー ===== -->
  <div id="app-flow">

    <div id="screen-home" class="app-screen active">
      <div id="home-text"></div>
      <button class="ticket-btn" id="btn-home" data-next="screen-step1">ようこそ</button>
    </div>

    <div id="screen-step1" class="app-screen instruction-screen">
      <div class="instruction-title">[ あそびかた ]</div>
      <img class="instruction-frame" src="assets/step1.png" alt="">
      <div class="instruction-caption" id="step1-text"></div>
      <button class="ticket-btn" id="btn-step1" data-next="screen-step2">次のステップ</button>
    </div>

    <div id="screen-step2" class="app-screen instruction-screen">
      <div class="instruction-title">[ あそびかた ]</div>
      <img class="instruction-frame" src="assets/step2.png" alt="">
      <div class="instruction-caption" id="step2-text"></div>
      <button class="ticket-btn" id="btn-step2" data-next="screen-step3">次のステップ</button>
    </div>

    <div id="screen-step3" class="app-screen instruction-screen">
      <div class="instruction-title">[ あそびかた ]</div>
      <img class="instruction-frame" src="assets/step3.png" alt="">
      <div class="instruction-caption" id="step3-text"></div>
      <button class="ticket-btn" id="btn-step3" data-next="AR_START">AR体験をはじめる</button>
    </div>

  </div>

  <!-- ===== ここから既存のAR画面 ===== -->
  <button id="blow-btn" class="ticket-btn">吹き飛ばす</button>

  <a-scene id="ar-scene" color-space="sRGB" embedded renderer="colorManagement: true" vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    mindar-image="imageTargetSrc: targets/targets.mind; autoStart: false;">
    <!-- 花びらの画像は先に読み込んでおく（白い四角が出るのを防ぐ） -->
    <a-assets>
      <img id="petal-1" src="assets/petals/petal-1.png">
      <img id="petal-2" src="assets/petals/petal-2.png">
      <img id="petal-3" src="assets/petals/petal-3.png">
      <img id="petal-4" src="assets/petals/petal-4.png">
    </a-assets>
    <a-light type="ambient" color="#FFF" intensity="0.8"></a-light>
    <a-light type="directional" color="#FFF" intensity="0.6" position="1 1 1"></a-light>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <!-- targetIndex 0 = 石のお家の写真マーカー（従来のもの） -->
    <a-entity id="target0" mindar-image-target="targetIndex: 0">
      <a-entity id="rose-wrapper-0" position="0 0 0" scale="1 1 1" rotation="0 0 0">
        <a-entity id="rose-normal-0" gltf-model="models/rose_normal.glb" visible="true"></a-entity>
        <a-entity id="rose-startled-0" gltf-model="models/a_rose.glb" visible="false" rotation="0 20 0"></a-entity>
      </a-entity>
    </a-entity>
    <!-- targetIndex 1 = レッドカーペットの写真マーカー（新規） -->
    <a-entity id="target1" mindar-image-target="targetIndex: 1">
      <a-entity id="rose-wrapper-1" position="0 0 0" scale="1 1 1" rotation="0 0 0">
        <a-entity id="rose-normal-1" gltf-model="models/rose_normal.glb" visible="true"></a-entity>
        <a-entity id="rose-startled-1" gltf-model="models/a_rose.glb" visible="false" rotation="0 20 0"></a-entity>
      </a-entity>
    </a-entity>
    <!-- targetIndex 2 = 石のお家の写真マーカー（天気の良い日の写真）※ target0 と同じバラを共有 -->
    <a-entity id="target2" mindar-image-target="targetIndex: 2">
      <a-entity id="rose-wrapper-2" position="0 0 0" scale="1 1 1" rotation="0 0 0">
        <a-entity id="rose-normal-2" gltf-model="models/rose_normal.glb" visible="true"></a-entity>
        <a-entity id="rose-startled-2" gltf-model="models/a_rose.glb" visible="false" rotation="0 20 0"></a-entity>
      </a-entity>
    </a-entity>
  </a-scene>

  <div id="debug-log">起動中...</div>

  <script>
    const logEl = document.getElementById("debug-log");
    function log(msg) {
      logEl.textContent += "\n" + msg;
      logEl.scrollTop = logEl.scrollHeight;
    }

    window.onerror = function (msg, url, line) {
      log("❌ エラー: " + msg + " (行:" + line + ")");
    };

    /* ============ タイプライター演出 ============ */
    function typeWriter(el, lines, charDelay, lineDelay, onDone) {
      let lineIndex = 0;
      let charIndex = 0;
      el.textContent = "";
      let currentLineEl2 = document.createElement("div");
      el.appendChild(currentLineEl2);

      function stepFixed() {
        if (lineIndex >= lines.length) { if (onDone) onDone(); return; }
        const line = lines[lineIndex];
        if (charIndex === 0 && lineIndex > 0) {
          currentLineEl2 = document.createElement("div");
          el.appendChild(currentLineEl2);
        }
        if (charIndex < line.length) {
          currentLineEl2.textContent += line[charIndex];
          charIndex++;
          setTimeout(stepFixed, charDelay);
        } else {
          lineIndex++;
          charIndex = 0;
          if (lineIndex < lines.length) {
            setTimeout(stepFixed, lineDelay);
          } else {
            if (onDone) onDone();
          }
        }
      }
      stepFixed();
    }

    function showButton(btn) {
      btn.classList.add("visible");
    }

    /* ============ 画面遷移 ============ */
    function goToScreen(id) {
      document.querySelectorAll(".app-screen").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }

    document.querySelectorAll(".ticket-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const next = btn.dataset.next;
        if (!next) return; // blow-btn には data-next が無いのでここで抜ける（専用のクリック処理は initGameLogic 内）
        if (next === "AR_START") {
          startARExperience();
        } else {
          goToScreen(next);
        }
      });
    });

    /* ============ 各画面のテキスト ============ */
    typeWriter(
      document.getElementById("home-text"),
      [
        "靱公園のバラ園に住む、",
        "一輪のバラの精霊。",
        "　",
        "年に二度だけ訪れる開花の季節を、",
        "彼女は自分の「公演期間」だと思い込んでいる。",
        "　",
        "誰よりもかまってほしがりな、",
        "自己愛たっぷりのスター気質。",
        "　",
        "その名も——バラ様。"
      ],
      45, 250,
      () => showButton(document.getElementById("btn-home"))
    );

    function setupStepTyping(screenId, textElId, btnId, lines) {
      let typed = false;
      const observer = new MutationObserver(() => {
        if (document.getElementById(screenId).classList.contains("active") && !typed) {
          typed = true;
          typeWriter(
            document.getElementById(textElId),
            lines, 45, 250,
            () => showButton(document.getElementById(btnId))
          );
        }
      });
      observer.observe(document.getElementById(screenId), { attributes: true, attributeFilter: ["class"] });
    }

    setupStepTyping("screen-step1", "step1-text", "btn-step1", [
      "カメラをマーカーに向けて、",
      "バラ様が出る前にお待ちください。"
    ]);
    setupStepTyping("screen-step2", "step2-text", "btn-step2", [
      "目を離すと、",
      "そっと距離を詰めてくる"
    ]);
    setupStepTyping("screen-step3", "step3-text", "btn-step3", [
      "近づかれすぎたら、",
      "画面に息を吹きかけて花びらを散らそう"
    ]);

    /* ============ シーンのログ登録（ページ読み込み時に一度だけ） ============ */
    const sceneEl = document.getElementById("ar-scene");
    sceneEl.addEventListener("loaded", () => log("✅ シーン読み込み完了"));
    sceneEl.addEventListener("arReady", () => log("✅ MindAR準備完了"));
    sceneEl.addEventListener("arError", (e) => log("❌ MindARエラー: " + JSON.stringify(e.detail)));

    /* ============ AR体験の開始（ここでカメラを起動） ============ */
    function startARExperience() {
      document.getElementById("app-flow").style.display = "none";

      // a-scene はページ読み込み時からずっと存在している（autoStart: false で待機中）。
      // ここで初めてカメラ・トラッキングを起動する。
      const arSystem = sceneEl.systems["mindar-image-system"];
      if (arSystem) {
        arSystem.start();
      } else {
        log("❌ mindar-image-system が見つかりません");
      }

      // ---- ここから診断用ログ（原因を特定するための一時的なもの） ----
      setTimeout(() => {
        const videoEl = document.querySelector("video");
        if (videoEl) {
          log("📹 video: readyState=" + videoEl.readyState +
            " paused=" + videoEl.paused +
            " size=" + videoEl.videoWidth + "x" + videoEl.videoHeight +
            " srcObject=" + (videoEl.srcObject ? "あり" : "なし"));
        } else {
          log("❌ video要素が見つかりません（MindARがvideoを作っていない）");
        }
        const canvasEl = sceneEl.canvas;
        if (canvasEl) {
          log("🖼️ canvas: " + canvasEl.width + "x" + canvasEl.height +
            " CSS表示サイズ=" + canvasEl.clientWidth + "x" + canvasEl.clientHeight);
        } else {
          log("❌ canvasが見つかりません");
        }
      }, 2500);
      // ---- 診断用ログここまで ----
    }

    /* ============ 既存のゲームロジック（凍結・接近・息の判定） ============ */
    /* a-scene が静的にあるので、ページ読み込み時に一度だけ初期化してよい */
    /* 複数マーカー対応：マーカーごとに独立した状態を持つコントローラーを作る */

    const blowBtn = document.getElementById("blow-btn");
    const controllers = [];

    function updateBlowButton() {
      const anyMaxed = controllers.some(c => c.isMaxed());
      if (anyMaxed) {
        blowBtn.classList.add("visible");
      } else {
        blowBtn.classList.remove("visible");
      }
    }

    /* suffixes：同じ被写体（＝同じ玫瑰）を共有するマーカー番号の配列
       例）[0, 2] なら target0 と target2 は同じ1本のバラの状態(progress)を共有する */
    function createRoseController(suffixes) {
      const parts = suffixes.map(function (sfx) {
        return {
          roseEntity: document.getElementById('rose-wrapper-' + sfx),
          normalEl: document.getElementById('rose-normal-' + sfx),
          startledEl: document.getElementById('rose-startled-' + sfx),
          targetEl: document.getElementById('target' + sfx)
        };
      });
      const label = suffixes.join("/");

      const SPEED = 0.5;
      const MAX_PROGRESS = 5;
      const BASE_SCALE = 1;
      const MAX_SCALE = 4;
      const BASE_Y = -0.1;
      const Y_PER_PROGRESS = -0.6;
      const MIN_LOST_MS = 400;

      const STARTLE_FLASH_MS = 220;
      const TILT_ANGLE = 18;
      const RETREAT_DURATION_MS = 1250;

      let progress = 0;
      let lostAt = null;
      let foundCount = 0; // いま認識中のマーカー数（同じ被写体の写真どれかが見えていればOK）
      let isRetreating = false;
      let isStartling = false;

      function setStartled(on) {
        parts.forEach(function (p) {
          p.startledEl.setAttribute('visible', on);
          p.normalEl.setAttribute('visible', !on);
        });
      }

      function setTilt(z) {
        parts.forEach(function (p) {
          p.roseEntity.setAttribute('rotation', { x: 0, y: 0, z: z });
        });
      }

      function applyPose() {
        const ratio = progress / MAX_PROGRESS;
        const scaleValue = BASE_SCALE + ratio * (MAX_SCALE - BASE_SCALE);
        const yValue = BASE_Y + progress * Y_PER_PROGRESS;
        parts.forEach(function (p) {
          p.roseEntity.setAttribute('position', { x: 0, y: yValue, z: 0 });
          p.roseEntity.setAttribute('scale', { x: scaleValue, y: scaleValue, z: scaleValue });
        });
      }

      /* ===== 吹き飛ばしの花びら ===== */
      /* バラが驚いて後ろへ逃げる間、バラの体から少しずつ花びらが取り残されて落ちる */
      /* 数値はシミュレーターの出力をそのまま貼り替えられます */
      const PETAL_IDS = ["#petal-1", "#petal-2", "#petal-3", "#petal-4"];
      const PETAL_COUNT = 20;       // 花びらの数
      const PETAL_SIZE = 0.19;      // 大きさ（バラの大きさに比例）
      const PETAL_RIM_X = 0.30;     // 花の頭の外周の横幅（バラの背丈を1として）
      const PETAL_RIM_Y = 0.28;     // 花の頭の外周の縦幅
      const PETAL_SPREAD = 0.3;     // 外周の厚み（ふちからのばらけ）
      const PETAL_OUT = 1.0;        // 外へ押し出される強さ
      const PETAL_HEAD_Y = 0.95;    // バラの頭の高さ（バラの背丈の目安）
      const PETAL_FRONT = 0.30;      // 花びらをバラの手前に出す量
      const PETAL_ONTOP = 0;        // 1＝バラの後ろに回っても常に手前に描く
      const PETAL_SPEED = 0.9;      // 動きの速さ（全体）
      const PETAL_UP = 0;        // ふわっと浮く強さ（0＝上へは飛ばない）
      const PETAL_SIDE = 1.2;       // 左右への広がり
      const PETAL_Z = 0.3;          // 手前(+)／奥(−)へ流される強さ
      const PETAL_GRAVITY = 1.8;    // 落ちる力
      const PETAL_DRAG = 0.6;       // 1秒あたりの速度の残り（小さいほどすぐ減速）
      const PETAL_INHERIT = 0;    // バラの逃げる勢いを引き継ぐ割合
      const PETAL_WOBBLE = 0.15;    // ゆらゆら横揺れの大きさ
      const PETAL_WOBBLE_SPEED = 6.8; // 横揺れの速さ
      const PETAL_SPIN = 1.0;       // くるくる回る速さ
      const PETAL_STAGGER_MS = 1000; // 花びらが離れ始める時間の幅(ms)（バラが退く時間くらい）
      const PETAL_FOLLOW = 0.90;     // バラの後退（小さく遠ざかる）に付いていく割合（0〜1）
      const PETAL_FADE_IN_MS = 150; // 花から離れて現れるまでの時間(ms)
      const PETAL_FADE_START = 0.5; // 寿命の何割から消え始めるか
      const PETAL_LIFE_MIN = 1300;  // 寿命(ms)
      const PETAL_LIFE_MAX = 2200;

      function spawnPetals() {
        const active = parts.find(function (p) { return p.targetEl.object3D.visible; }) || parts[0];
        const parent = active.targetEl;
        const roseObj = active.roseEntity.object3D;
        const k = Math.max(roseObj.scale.x, 1);
        // バラが逃げる速さ（上へ／小さくなりながら）
        const roseVy = -Y_PER_PROGRESS * progress / (RETREAT_DURATION_MS / 1000);
        const list = [];

        for (let i = 0; i < PETAL_COUNT; i++) {
          const el = document.createElement('a-plane');
          const size = PETAL_SIZE * k * (0.7 + Math.random() * 0.6);
          el.setAttribute('width', size);
          el.setAttribute('height', size);
          // 最初は opacity 0（画像が読み込まれる前の白い四角を見せない）
          el.setAttribute('material', {
            src: PETAL_IDS[Math.floor(Math.random() * PETAL_IDS.length)],
            transparent: true,
            opacity: 0,
            side: 'double',
            shader: 'flat',
            alphaTest: 0.02,
            depthTest: !PETAL_ONTOP,
            depthWrite: false
          });
          el.setAttribute('visible', false);
          parent.appendChild(el);

          list.push({
            el: el,
            started: false,
            shown: false,
            delay: Math.random() * PETAL_STAGGER_MS,
            // 離れた瞬間のバラの位置・大きさから出発する（start で決める）
            rr: [Math.random() - 0.5, Math.random(), Math.random() - 0.5],
            ang: Math.random() * 6.2832, jx: Math.random() - 0.5, jy: Math.random(), jz: Math.random(),
            rx: Math.random() * 6.28, ry: Math.random() * 6.28, rz: Math.random() * 6.28,
            srx: (Math.random() - 0.5) * 8 * PETAL_SPIN,
            sry: (Math.random() - 0.5) * 8 * PETAL_SPIN,
            srz: (Math.random() - 0.5) * 6 * PETAL_SPIN,
            wob: Math.random() * 6.28,
            life: PETAL_LIFE_MIN + Math.random() * (PETAL_LIFE_MAX - PETAL_LIFE_MIN)
          });
        }

        const t0 = Date.now();
        let last = t0;
        function tick() {
          const now = Date.now();
          const dt = Math.min((now - last) / 1000, 0.05);
          last = now;
          const elapsed = now - t0;
          const drag = Math.pow(PETAL_DRAG, dt);
          let alive = 0;

          list.forEach(function (p) {
            if (p.dead) return;
            alive++;
            const local = elapsed - p.delay;
            if (local < 0) return;
            if (!p.started) {
              // この瞬間のバラの体から離れる
              const kNow = Math.max(roseObj.scale.x, 1);
              p.x = roseObj.position.x + p.rr[0] * PETAL_SPREAD * kNow;
              p.y = roseObj.position.y + (PETAL_HEAD_Y + (p.rr[1] - 0.5) * PETAL_SPREAD) * kNow;
              p.z = (PETAL_FRONT + p.rr[2] * PETAL_SPREAD) * kNow;
              p.k = kNow;
              // 離れた瞬間のバラの位置（アンカー）。花びらの位置・速度は「バラの背丈を1とした座標」で持つ
              p.ax = roseObj.position.x; p.ay = roseObj.position.y; p.az = roseObj.position.z;
              // 花の頭の「外周」（輪郭のふち）のどこかから出て、外向きに離れていく
              const ring = 1 + (p.rr[1] - 0.5) * PETAL_SPREAD * 2; // 外周の厚み
              const cx = Math.cos(p.ang), cy = Math.sin(p.ang);
              p.lx = cx * PETAL_RIM_X * ring;
              p.ly = PETAL_HEAD_Y + cy * PETAL_RIM_Y * ring;
              p.lz = PETAL_FRONT + p.rr[2] * 0.2;
              p.vx = (cx * PETAL_OUT * 1.2 + p.jx * 0.4) * PETAL_SIDE * PETAL_SPEED;
              p.vy = (Math.min(cy, 0) * PETAL_OUT * 0.6 + roseVy / kNow * PETAL_INHERIT * (0.5 + p.jy) + p.jy * PETAL_UP) * PETAL_SPEED;
              p.vz = PETAL_Z * (0.3 + p.jz) * PETAL_SPEED;
              p.started = true;
            }
            const t = local / p.life;
            if (t >= 1) {
              if (p.el.parentNode) p.el.parentNode.removeChild(p.el);
              p.dead = true;
              return;
            }
            p.vx *= drag;
            p.vy *= drag;
            p.vz *= drag;
            p.vy -= PETAL_GRAVITY * dt;
            p.lx += p.vx * dt + Math.sin(local / 1000 * PETAL_WOBBLE_SPEED + p.wob) * PETAL_WOBBLE * dt;
            p.ly += p.vy * dt;
            p.lz += p.vz * dt;
            // バラの後退（小さくなる・遠ざかる）にどれだけ付いていくか。1＝バラと同じ空間にいる
            const kF = p.k + (Math.max(roseObj.scale.x, 1) - p.k) * PETAL_FOLLOW;
            p.x = p.ax + (roseObj.position.x - p.ax) * PETAL_FOLLOW + p.lx * kF;
            p.y = p.ay + (roseObj.position.y - p.ay) * PETAL_FOLLOW + p.ly * kF;
            p.z = p.az + (roseObj.position.z - p.az) * PETAL_FOLLOW + p.lz * kF;
            p.rx += p.srx * dt;
            p.ry += p.sry * dt;
            p.rz += p.srz * dt;
            p.el.object3D.position.set(p.x, p.y, p.z);
            p.el.object3D.rotation.set(p.rx, p.ry, p.rz);

            const mesh = p.el.getObject3D('mesh');
            const loaded = mesh && mesh.material && mesh.material.map && mesh.material.map.image;
            if (!loaded) return; // 画像の準備ができるまでは見せない
            if (!p.shown) {
              p.shown = true;
              p.el.object3D.visible = true;
            }
            // 離れた瞬間は小さく・薄く現れて、すぐ元の大きさになる（突然ぱっと出ない）
            const fin = PETAL_FADE_IN_MS > 0 ? Math.min(local / PETAL_FADE_IN_MS, 1) : 1;
            p.el.object3D.scale.setScalar((kF / k) * (0.4 + 0.6 * fin));
            const fout = t < PETAL_FADE_START ? 1 : 1 - (t - PETAL_FADE_START) / (1 - PETAL_FADE_START);
            mesh.material.opacity = fin * fout;
          });

          if (alive > 0) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      }

      function flashStartled() {
        isStartling = true;
        setStartled(true);

        const startTime = Date.now();
        function tiltStep() {
          const elapsed = Date.now() - startTime;
          const t = Math.min(elapsed / STARTLE_FLASH_MS, 1);
          setTilt(Math.sin(t * Math.PI) * TILT_ANGLE);
          if (t < 1) {
            requestAnimationFrame(tiltStep);
          } else {
            setTilt(0);
            if (!isRetreating) {
              setStartled(false);
            }
            isStartling = false;
          }
        }
        requestAnimationFrame(tiltStep);
      }

      parts.forEach(function (p) {
        p.targetEl.addEventListener("targetFound", () => {
          foundCount++;
          if (isRetreating) return;
          // もう一枚の写真で既に認識中なら、「見失って戻った」扱いにはしない
          if (foundCount > 1) {
            applyPose();
            return;
          }
          if (lostAt !== null) {
            const lostDurationMs = Date.now() - lostAt;
            if (lostDurationMs >= MIN_LOST_MS) {
              const elapsedSec = lostDurationMs / 1000;
              progress = Math.min(progress + elapsedSec * SPEED, MAX_PROGRESS);
              flashStartled();
            } else {
              log("（マーカー" + label + ": ノイズ判定、無視）" + lostDurationMs + "ms");
            }
            lostAt = null;
          }
          log("🎯 マーカー" + label + " 発見！ progress=" + progress.toFixed(2));
          applyPose();
          updateBlowButton();
        });

        p.targetEl.addEventListener("targetLost", () => {
          foundCount = Math.max(0, foundCount - 1);
          // すべての写真を見失ったときだけ「見失った」とみなす
          if (foundCount === 0) {
            lostAt = Date.now();
          }
        });
      });

      function animateRetreat() {
        isRetreating = true;
        setStartled(true);
        spawnPetals();
        updateBlowButton();
        const startProgress = progress;
        const startTime = Date.now();

        function step() {
          const elapsed = Date.now() - startTime;
          const t = Math.min(elapsed / RETREAT_DURATION_MS, 1);
          progress = startProgress * (1 - t);
          applyPose();

          if (t < 1) {
            requestAnimationFrame(step);
          } else {
            progress = 0;
            applyPose();
            isRetreating = false;
            setStartled(false);
            updateBlowButton();
            log("🌬️ マーカー" + label + " 吹き飛ばし完了");
          }
        }
        requestAnimationFrame(step);
      }

      return {
        isMaxed: () => progress >= MAX_PROGRESS && !isRetreating,
        retreat: () => {
          if (progress >= MAX_PROGRESS && !isRetreating) {
            animateRetreat();
          }
        }
      };
    }

    // 石のお家は2枚の写真（0=従来 / 2=天気の良い日）で1本のバラを共有、レッドカーペットは別のバラ
    controllers.push(createRoseController([0, 2]));
    controllers.push(createRoseController([1]));

    blowBtn.addEventListener("click", () => {
      log("💨 「吹き飛ばす」ボタンが押された → 吹き飛ばす！");
      controllers.forEach(c => c.retreat());
    });
  </script>
</body>
